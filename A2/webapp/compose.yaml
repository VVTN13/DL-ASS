# docker compose up --build        -> http://localhost:8080
# Checkpoints are not in Git: run backend/scripts/checkpoints.py first (see README).
name: sleep-webapp

x-backend: &backend
  build: ./backend
  image: sleep-webapp-backend
  environment:
    DATABASE_URL: postgresql+psycopg://sleep:${POSTGRES_PASSWORD:-sleep}@db:5432/sleep
    DATA_DIR: /data
    CHECKPOINTS_DIR: /checkpoints
    RETENTION_DAYS: ${RETENTION_DAYS:-30}
    TORCH_THREADS: ${TORCH_THREADS:-4}
  volumes:
    - appdata:/data
    - ${CHECKPOINTS_DIR:-./backend/checkpoints}:/checkpoints:ro
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sleep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sleep}
      POSTGRES_DB: sleep
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleep -d sleep"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && fastapi run app/main.py --port 8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 5s
      retries: 40

  worker:
    <<: *backend
    command: python -m app.worker
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
