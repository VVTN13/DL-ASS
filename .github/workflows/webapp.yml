name: webapp

on:
  push:
    paths:
      - "A2/webapp/**"
      - "A2/model_lib.py"
      - "A2/attnsleep.py"
      - "A2/preprocessing.py"
      - ".github/workflows/webapp.yml"
  pull_request:
    paths:
      - "A2/webapp/**"
      - "A2/model_lib.py"
      - "A2/attnsleep.py"
      - "A2/preprocessing.py"
      - ".github/workflows/webapp.yml"

concurrency:
  group: webapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: A2/webapp/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sleep
          POSTGRES_PASSWORD: sleep
          POSTGRES_DB: sleep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sleep -d sleep"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: A2/webapp/backend/uv.lock
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: API contract is committed
        run: uv run python scripts/export_openapi.py --check
      - name: Migrations apply and match the models
        run: uv run alembic upgrade head && uv run alembic check
      # Trained weights are not in Git; the suite generates synthetic ones (see tests/conftest.py).
      - name: Unit, parity and API tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: A2/webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: A2/webapp/frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Generated API types match the backend contract
        run: npm run generate:api && git diff --exit-code src/api/schema.d.ts
      - name: Type-check and build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: A2/webapp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: A2/webapp/backend/uv.lock
      - name: Generate synthetic checkpoints
        working-directory: A2/webapp/backend
        run: |
          uv sync --frozen
          uv run python scripts/checkpoints.py synthetic --out "$RUNNER_TEMP/checkpoints"
          echo "CHECKPOINTS_DIR=$RUNNER_TEMP/checkpoints" >> "$GITHUB_ENV"
      - name: Start the stack
        run: docker compose up --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: A2/webapp/frontend/package-lock.json
      - name: Install Playwright
        working-directory: A2/webapp/frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: A2/webapp/frontend
        run: npx playwright test
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            A2/webapp/frontend/playwright-report
            A2/webapp/frontend/test-results
          retention-days: 14
